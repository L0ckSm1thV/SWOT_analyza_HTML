<style>
:root{
  --bg:#f6f6f3;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e2e1dc;--acc:#2f5d50;
  --S:#2e7d4f;--W:#c26a1b;--O:#2a62a8;--T:#b23a3a;
  --Sbg:#e7f3ec;--Wbg:#fbefe3;--Obg:#e6eef8;--Tbg:#f8e6e6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151614;--card:#1f201d;--ink:#ecebe6;--mute:#9a9992;--line:#34352f;--acc:#7cc1a8;
  --S:#6cc795;--W:#e8a25c;--O:#7aa9e6;--T:#e67b7b;
  --Sbg:#1d2e24;--Wbg:#33271b;--Obg:#1c2634;--Tbg:#332020;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 0}
.title{display:flex;gap:8px;align-items:center}
.title select{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--card);color:var(--ink);font:600 14px inherit}
.title+.title{margin-top:6px}
.title input{flex:1;font:600 17px/1.3 inherit;border:0;background:transparent;color:var(--ink);padding:4px 0;outline:none;border-bottom:1px dashed transparent}
.title input:focus{border-bottom-color:var(--line)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px}
nav button{flex:1;min-width:max-content;border:0;background:none;color:var(--mute);padding:10px 10px;font:600 13px inherit;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
main{padding:12px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid4{display:grid;gap:12px}
@media(min-width:760px){.grid4{grid-template-columns:1fr 1fr}}
h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
h2 .tag{font:700 12px/1 inherit;padding:4px 7px;border-radius:6px;color:#fff}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.f{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.f .code{font:700 12px/1 ui-monospace,monospace;min-width:26px;padding-top:10px}
.f textarea{flex:1;resize:vertical;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
.f select{border:1px solid var(--line);border-radius:8px;padding:8px 4px;background:var(--bg);color:var(--ink);font:inherit}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:6px 4px;cursor:pointer}
.add{border:1px dashed var(--line);background:none;color:var(--mute);width:100%;padding:9px;border-radius:8px;font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;border-radius:9px;font:600 13.5px inherit;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.m{border-collapse:separate;border-spacing:3px}
table.m th{font:700 12px ui-monospace,monospace;padding:4px;color:var(--mute)}
table.m td.c button{width:40px;height:40px;border-radius:7px;border:1px solid var(--line);font:700 14px inherit;cursor:pointer;color:var(--ink);background:var(--card)}
table.m td.gap,table.m th.gap{width:6px;padding:0}
.legend{font-size:12.5px;color:var(--mute);columns:2 220px;margin-top:8px}
.legend div{break-inside:avoid;margin-bottom:3px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{border-radius:10px;padding:10px;border:1px solid var(--line)}
.tot b{font-size:20px;display:block}
.tot.best{outline:2px solid var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:999px;padding:4px 9px;font:600 12px inherit;cursor:pointer}
.chip.on{color:#fff}
.strat{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.hint{font-size:12.5px;color:var(--mute);margin:4px 0 8px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.5 ui-monospace,monospace;max-height:55vh;overflow:auto}
textarea.io{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--ink)}
.note{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.show{display:flex}
.modal .card{max-width:360px;width:100%}
.ph{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 2px 8px}
.m2{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.m2 .ax{font-size:11px;color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center}
.m2 .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.m2 .q{border:1px solid var(--line);border-radius:9px;padding:8px;min-height:70px;background:var(--bg)}
.m2 .q.hot{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--bg))}
.m2 .q b{display:block;font-size:11.5px;margin-bottom:5px}
.cd{display:inline-block;font:700 11.5px ui-monospace,monospace;padding:2px 6px;border-radius:5px;color:#fff;margin:0 3px 3px 0}
.inp{border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--bg);color:var(--ink);font:inherit}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw>div{border-radius:10px;padding:10px;border:1px solid var(--line);font-size:13px}
.sw ul{margin:4px 0 0;padding-left:18px}
details.ref{margin:4px 0 8px}
details.ref summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mute);padding:4px 0}
.ref li{margin-bottom:3px}
.help h3{font-size:14px;margin:14px 0 4px}
.help p,.help li{font-size:13.5px}
.help ul{padding-left:18px;margin:4px 0}
#printv{display:none}
@media print{body>*:not(#printv){display:none!important}#printv{display:block;color:#000;background:#fff;font:10.5pt/1.4 Calibri,Arial,sans-serif}
#printv h1{font-size:20pt;color:#2f5d50}#printv h2{font-size:14pt;color:#2f5d50;border-bottom:1px solid #2f5d50;margin-top:18pt;break-after:avoid}#printv h3{font-size:12pt;break-after:avoid}
#printv table{border-collapse:collapse;width:100%;margin:6pt 0;break-inside:auto}#printv th,#printv td{border:1px solid #bbb;padding:3pt 5pt;text-align:left;vertical-align:top}#printv th{background:#e7eeea}#printv tr{break-inside:avoid}#printv .li{margin:2pt 0 2pt 12pt}
@page{size:A4;margin:18mm}}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<header>
  <div class="title"><select id="pick" aria-label="Uložené analýzy"></select><button class="btn" id="newA">+ Nová</button></div>
  <div class="title"><span class="note">Název:</span><input id="title" placeholder="Pojmenuj analýzu" aria-label="Název analýzy"><button class="btn" id="helpB" title="Nápověda k SWOT analýze" style="padding:7px 11px;white-space:nowrap">? Nápověda</button></div>
  <nav id="tabs">
    <button data-t="z">Zadání</button>
    <button data-t="p">PESTLE</button>
    <button data-t="f">SWOT</button>
    <button data-t="m">IFE / EFE</button>
    <button data-t="s">Strategie</button>
    <button data-t="o">Výstup</button>
  </nav>
</header>
<main id="main"></main>
<footer style="text-align:center;font-size:10.5px;color:var(--mute);opacity:.55;padding:18px 0 22px;letter-spacing:.04em">Created by L0cksm1thV · 2026</footer>
<div id="printv"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><p id="mtext"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="mno">Zrušit</button><button class="btn pri" id="myes">Ano</button></div></div></div>

<script>
(function(){
"use strict";
var KEY="swot-tows-v1",LKEY="swot-tows-lib-v1";
var Q={
  S:{name:"Silné stránky",sub:"Interní – vlastní schopnosti, výcvik, vybavení, lidé, velení"},
  W:{name:"Slabé stránky",sub:"Interní – nedostatky ve schopnostech, mezery, omezení"},
  O:{name:"Příležitosti",sub:"Externí – vývoj situace, spojenci, nové technologie, zdroje"},
  T:{name:"Hrozby",sub:"Externí – protivník, hybridní hrozby, rizika prostředí"}
};
var ST={
  SO:{a:"S",b:"O",name:"SO · Maxi-Maxi",desc:"Silné stránky využít k chopení se příležitostí (aktivní/ofenzivní přístup)."},
  ST:{a:"S",b:"T",name:"ST · Maxi-Mini",desc:"Silné stránky využít k odvrácení hrozeb (odstrašení, odvracení hrozeb)."},
  WO:{a:"W",b:"O",name:"WO · Mini-Maxi",desc:"Příležitosti využít k odstranění slabin (rozvoj a doplnění schopností)."},
  WT:{a:"W",b:"T",name:"WT · Mini-Mini",desc:"Omezit slabiny a vyhnout se hrozbám (defenzivní přístup, ochrana)."}
};
var PC={
  P:{l:"P",name:"Politické",sub:"Politická situace, mandát, spojenci, geopolitika"},
  Ec:{l:"E",name:"Ekonomické",sub:"Rozpočet obrany, financování, zdroje, dodávky"},
  So:{l:"S",name:"Sociální",sub:"Veřejné mínění, nábor, morálka, demografie, dezinformace"},
  Te:{l:"T",name:"Technologické",sub:"Kybernetika, drony, komunikace, EW, nové technologie"},
  L:{l:"L",name:"Legislativní",sub:"Zákony, mandát, mezinárodní právo, pravidla nasazení"},
  En:{l:"E",name:"Environmentální",sub:"Terén, počasí, klima, infrastruktura, prostředí nasazení"},
  MP:{l:"P",name:"Politické",sub:"Vláda, mandát, spojenci, politická stabilita, klíčoví aktéři"},
  MM:{l:"M",name:"Vojenské",sub:"Vlastní, spojenecké a protivníkovy síly, schopnosti, rozmístění"},
  ME:{l:"E",name:"Ekonomické",sub:"Ekonomika, rozpočet, zdroje, logistika, sankce"},
  MS:{l:"S",name:"Sociální",sub:"Obyvatelstvo, demografie, kultura, náboženství, veřejné mínění"},
  MI:{l:"I",name:"Informační",sub:"Média, informační prostředí, dezinformace, kyberprostor"},
  MN:{l:"I",name:"Infrastruktura",sub:"Doprava, energetika, komunikace, kritická infrastruktura"},
  MF:{l:"PE",name:"Fyzické prostředí",sub:"Terén, počasí, klima, přírodní podmínky"},
  MT:{l:"T",name:"Čas",sub:"Časové faktory, termíny, tempo, sezónnost, délka trvání"}
};
var FWK={pestle:{name:"PESTLE",title:"PESTLE – makroprostředí",k:["P","Ec","So","Te","L","En"]},pmesii:{name:"PMESII-PT",title:"PMESII-PT – operační prostředí",k:["MP","MM","ME","MS","MI","MN","MF","MT"]}};
var ALLK=Object.keys(PC);
function PKm(){return FWK[D.env==="pmesii"?"pmesii":"pestle"].k;}
function FWn(){return FWK[D.env==="pmesii"?"pmesii":"pestle"];}
var tab="z";
function blank(){var o={thr:{imp:3,prob:50},goals:{general:"",items:[]},checks:{},title:"",topic:"",goal:"",situation:"",info:[],created:Date.now(),pestle:{},env:"pestle",scale:5,factors:{S:[],W:[],O:[],T:[]},scores:{},strategies:{SO:[],ST:[],WO:[],WT:[]}};ALLK.forEach(function(k){o.pestle[k]=[];});return o;}
var LIB=null;
try{var lr=localStorage.getItem(LKEY);if(lr){LIB=JSON.parse(lr);if(!LIB||!LIB.items||!LIB.items[LIB.cur])LIB=null;}}catch(e){}
if(!LIB){var first=blank();try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.factors)first=fix(p);}}catch(e){}
  if(!first.title)first.title="Analýza "+today();var fid=uid();LIB={cur:fid,items:{}};LIB.items[fid]=first;}
var D=fix(LIB.items[LIB.cur]);
function today(){var d=new Date();return d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear();}
try{if(location.hash&&/^#[zpfmsoh]$/.test(location.hash))tab=location.hash.slice(1);}catch(e){}

function inv(v){var a=String(v||"").split(/[\s;,]+/).map(parseFloat).filter(function(x){return x>=1&&x<=5;});return a.map(function(x){return String(Math.round((6-x)*100)/100);}).join(" ");}
function fix(p){var b=blank();b.title=p.title||"";b.goal=String(p.goal||"");b.topic=String(p.topic||"");b.situation=String(p.situation||"");b.info=(p.info||[]).map(function(x){return{id:x.id||uid(),text:String(x.text||""),src:String(x.src||""),done:!!x.done};});b.created=p.created||Date.now();b.updated=p.updated||b.created;["S","W","O","T"].forEach(function(k){b.factors[k]=(p.factors[k]||[]).map(function(f){var w=+f.w||3;return{id:f.id||uid(),text:String(f.text||""),why:String(f.why||""),
    perf:+f.perf||(k==="S"?Math.max(3,w):k==="W"?Math.min(3,6-w):3),rat:f.rat!==undefined?(p.scale===5?String(f.rat):inv(f.rat)):(f.w?String(w):""),resp:+f.resp||2,prob:f.prob!==undefined?+f.prob:50,key:(f.key===true||f.key===false)?f.key:null,src:f.src||null};});});
  var th=p.thr||{};b.thr={imp:th.imp?(p.scale===5?+th.imp:6-th.imp):3,prob:th.prob!==undefined?+th.prob:50};var g=p.goals||{};b.goals={general:String(g.general||""),items:(g.items||[]).map(function(x){return{id:x.id||uid(),text:String(x.text||""),ind:String(x.ind||""),val:String(x.val||""),term:String(x.term||""),tasks:String(x.tasks||"")};})};b.checks=p.checks||{};
  b.env=p.env==="pmesii"?"pmesii":"pestle";
  ALLK.forEach(function(k){b.pestle[k]=((p.pestle||{})[k]||[]).map(function(f){return{id:f.id||uid(),text:String(f.text||""),imp:+f.imp||3,prob:+f.prob||3,dir:f.dir||"",lnk:f.lnk||null};});});
  b.scores=p.scores||{};["SO","ST","WO","WT"].forEach(function(k){b.strategies[k]=((p.strategies||{})[k]||[]).map(function(s){return{id:s.id||uid(),text:String(s.text||""),links:s.links||[]};});});return b;}
function uid(){return Math.random().toString(36).slice(2,9);}
function save(){D.updated=Date.now();LIB.items[LIB.cur]=D;try{localStorage.setItem(LKEY,JSON.stringify(LIB));}catch(e){}}
function renderPick(){var ids=Object.keys(LIB.items).sort(function(a,b){return (LIB.items[b].updated||0)-(LIB.items[a].updated||0);});
  document.getElementById("pick").innerHTML=ids.map(function(id){return '<option value="'+id+'"'+(id===LIB.cur?' selected':'')+'>'+esc(LIB.items[id].title||"Bez názvu")+'</option>';}).join("");}
function openA(id){LIB.cur=id;D=fix(LIB.items[id]);save();renderPick();render();}
function newA(src,name){var n=src?fix(JSON.parse(JSON.stringify(src))):blank();n.created=Date.now();n.title=name||n.title||("Analýza "+today());var id=uid();LIB.items[id]=n;openA(id);return id;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function code(k,i){return k+(i+1);}
function find(id){for(var k in D.factors){var a=D.factors[k];for(var i=0;i<a.length;i++)if(a[i].id===id)return{k:k,i:i,f:a[i]};}return null;}
function sc(a,b){return +D.scores[a+"|"+b]||0;}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove("show");},1600);}
function ask(t,cb){var m=document.getElementById("modal");document.getElementById("mtext").textContent=t;m.classList.add("show");
  document.getElementById("myes").onclick=function(){m.classList.remove("show");cb();};document.getElementById("mno").onclick=function(){m.classList.remove("show");};}

function quad(k){var s=ST[k],A=keys(s.a),B=keys(s.b),raw=0,wt=0,max=0,pairs=[];
  A.forEach(function(a){B.forEach(function(b){var v=sc(a.f.id,b.f.id),ww=fwt(s.a,a.f)*fwt(s.b,b.f);raw+=v;wt+=v*ww;max+=3*ww;if(v)pairs.push({a:a.c,b:b.c,v:v,w:v*ww});});});
  pairs.sort(function(x,y){return y.w-x.w;});return{raw:raw,wt:Math.round(wt*10)/10,max:max,pct:max?Math.round(wt/max*100):0,pairs:pairs};}

/* ---------- render ---------- */
function render(){
  var tp=document.querySelector('#tabs [data-t="p"]');if(tp)tp.textContent=FWn().name;
  document.getElementById("title").value=D.title;renderPick();
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.t===tab);});
  var h="";
  if(tab==="h")h=rH();else if(tab==="z")h=rZ();else if(tab==="p")h=rP();else if(tab==="f")h=rF();else if(tab==="m")h=rM();else if(tab==="s")h=rS();else h=rO();
  document.getElementById("main").innerHTML=h;
}
function pcode(k,i){return {P:"P",Ec:"Ek",So:"S",Te:"T",L:"L",En:"En",MP:"P",MM:"M",ME:"E",MS:"S",MI:"I",MN:"IN",MF:"PE",MT:"T"}[k]+(i+1);}
function pfind(id){for(var k in D.pestle){var a=D.pestle[k];for(var i=0;i<a.length;i++)if(a[i].id===id)return{k:k,i:i,f:a[i]};}return null;}
function pw(f){return Math.max(1,Math.min(5,Math.round(f.imp*f.prob/5)));}
var INFOSUG=["Zpravodajské hodnocení situace","Protivník / aktéři hrozeb","Vlastní schopnosti a kapacity","Rozpočet a zdroje","Legislativa a mandát","Spojenci a spolupráce","Terén a prostředí","Technologie a komunikace","Poučení z minulých operací a cvičení"];
function rZ(){var done=D.info.filter(function(x){return x.done;}).length;
  var h='<div class="card"><h2>Téma analýzy</h2><p class="sub">Co analyzuješ – jednotku, schopnost, operaci, prostor, rozhodnutí…</p><div class="f"><textarea rows="1" data-zf="topic" placeholder="např. Ochrana kritické infrastruktury v regionu X">'+esc(D.topic)+'</textarea></div></div>'+
  '<div class="card"><h2>Cíl analýzy</h2><p class="sub">Co má analýza rozhodnout nebo podpořit; rozsah a časový horizont.</p><div class="f"><textarea rows="2" data-zf="goal" placeholder="např. Určit priority rozvoje schopností do 03/2027">'+esc(D.goal)+'</textarea></div></div>'+
  '<div class="card"><h2>Výchozí situace</h2><p class="sub">Současný stav, kontext, známá fakta a omezení.</p><div class="f"><textarea rows="4" data-zf="situation" placeholder="Kde jsme teď, co víme, co nás omezuje">'+esc(D.situation)+'</textarea></div></div>'+
